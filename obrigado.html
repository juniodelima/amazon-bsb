<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pedido confirmado — Amazon BSB</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{--green-900:#2a3618;--green-800:#3d4a2a;--green-700:#4a5a30;--green-100:#e8edd4;--cream-50:#faf7e8;--cream-100:#f5f0d8;--line:#e3decb;--gold:#b89938;--ink:#1d2110;--muted:#6b6f56;--paper:#fdfbf3;}
  *{box-sizing:border-box;} html,body{margin:0;padding:0;font-family:'Manrope',system-ui,sans-serif;color:var(--ink);background:var(--cream-100);-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;} button{font-family:inherit;cursor:pointer;border:none;background:none;padding:0;}
  .fh{background:var(--green-900);padding:16px 24px;text-align:center;}
  .fh-logo{font-weight:800;font-size:18px;letter-spacing:.04em;color:#ebe4c2;}
  .fh-logo span{color:#a6b87a;}
  .progress{background:white;border-bottom:1px solid var(--line);padding:16px 24px;}
  .progress-inner{max-width:520px;margin:0 auto;display:flex;align-items:center;}
  .step{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;position:relative;}
  .step::after{content:'';position:absolute;top:14px;left:50%;width:100%;height:2px;background:var(--green-100);z-index:0;}
  .step:last-child::after{display:none;}
  .step-num{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;z-index:1;position:relative;}
  .step-num.done{background:var(--green-700);color:white;}
  .step-label{font-size:11px;color:var(--muted);font-weight:600;}
  .step.active .step-label{color:var(--green-900);}
  .ob-wrap{max-width:600px;margin:48px auto;padding:0 16px;}
  .ob-card{background:white;border-radius:20px;border:1px solid var(--line);padding:48px 40px;text-align:center;}
  .ob-icon{font-size:64px;line-height:1;margin-bottom:20px;}
  .ob-card h1{font-size:28px;font-weight:800;color:var(--green-900);margin:0 0 8px 0;letter-spacing:-.02em;}
  .ob-card .ob-sub{font-size:16px;color:var(--muted);margin:0 0 24px 0;line-height:1.5;}
  .ob-code{font-family:'DM Mono',monospace;font-size:14px;color:var(--muted);background:var(--cream-100);padding:8px 18px;border-radius:999px;display:inline-block;margin-bottom:28px;}
  .ob-detail{background:var(--cream-50);border-radius:14px;padding:20px 24px;margin-bottom:28px;text-align:left;}
  .ob-detail-row{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;color:var(--ink-soft);}
  .ob-detail-row b{color:var(--green-900);}
  .ob-wa-btn{display:inline-flex;align-items:center;gap:10px;padding:16px 28px;border-radius:14px;background:#25d366;color:white;font-size:15px;font-weight:700;transition:background .15s;margin-bottom:14px;width:100%;justify-content:center;}
  .ob-wa-btn:hover{background:#22c55e;}
  .ob-home{font-size:14px;color:var(--muted);display:block;text-align:center;}
  .ob-home:hover{color:var(--ink);}
  @media(max-width:540px){.ob-card{padding:32px 24px;}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="obrigado.jsx"></script>
</body>
</html>
