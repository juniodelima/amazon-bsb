<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout — Amazon BSB</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%232a3618'/><polygon points='16,3 21,11 18,11 22,19 18.5,19 19.5,28 12.5,28 13.5,19 10,19 14,11 11,11' fill='%23a6b87a'/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{--green-900:#2a3618;--green-800:#3d4a2a;--green-700:#4a5a30;--green-600:#5a6e3a;--green-400:#a6b87a;--green-100:#e8edd4;--cream-50:#faf7e8;--cream-100:#f5f0d8;--cream-200:#ebe4c2;--gold:#b89938;--ink:#1d2110;--ink-soft:#3b4128;--muted:#6b6f56;--line:#e3decb;--paper:#fdfbf3;}
  *{box-sizing:border-box;} html,body{margin:0;padding:0;font-family:'Manrope',system-ui,sans-serif;color:var(--ink);background:var(--cream-100);-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;} button{font-family:inherit;cursor:pointer;border:none;background:none;padding:0;}

  /* Header */
  .fh{background:var(--green-900);padding:16px 24px;text-align:center;}
  .fh-logo{font-weight:800;font-size:18px;letter-spacing:.04em;color:#ebe4c2;}
  .fh-logo span{color:#a6b87a;}

  /* Progress */
  .progress{background:white;border-bottom:1px solid var(--line);padding:16px 24px;}
  .progress-inner{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:0;}
  .step{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;position:relative;}
  .step::after{content:'';position:absolute;top:14px;left:50%;width:100%;height:2px;background:var(--line);z-index:0;}
  .step:last-child::after{display:none;}
  .step-num{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;z-index:1;position:relative;}
  .step-num.done{background:var(--green-700);color:white;}
  .step-num.active{background:var(--green-900);color:white;}
  .step-num.pending{background:var(--cream-200);color:var(--muted);}
  .step-label{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap;}
  .step.active .step-label{color:var(--green-900);}

  /* Layout */
  .co-wrap{max-width:960px;margin:32px auto;padding:0 16px;display:grid;grid-template-columns:1fr 380px;gap:24px;align-items:flex-start;}
  .co-card{background:white;border-radius:16px;border:1px solid var(--line);overflow:hidden;}
  .co-card-head{padding:20px 24px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px;color:var(--green-900);}
  .co-card-body{padding:24px;}

  /* Cart summary */
  .cart-line{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);}
  .cart-line:last-child{border-bottom:none;}
  .cart-line-img{position:relative;width:72px;height:72px;border-radius:10px;background:var(--cream-100);overflow:hidden;flex-shrink:0;}
  .cart-line-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.18);transform-origin:center;}
  .cart-line-name{font-size:14px;font-weight:600;color:var(--ink);}
  .cart-line-meta{font-size:12px;color:var(--muted);}
  .cart-line-price{font-size:14px;font-weight:700;color:var(--green-900);margin-left:auto;white-space:nowrap;}
  .qty-ctrl{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:6px;}
  .qty-ctrl button{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;color:var(--muted);}
  .qty-ctrl button:hover{background:var(--cream-100);}
  .qty-ctrl span{width:32px;text-align:center;font-size:13px;font-weight:700;}

  /* Total row */
  .total-row{display:flex;justify-content:space-between;align-items:baseline;padding-top:16px;border-top:1px solid var(--line);margin-top:4px;}
  .total-row b{font-size:22px;font-weight:800;color:var(--green-900);}

  /* Form */
  .f-field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
  .f-field label{font-size:12px;font-weight:700;color:var(--ink-soft);}
  .f-field input{padding:13px 14px;border-radius:10px;border:1.5px solid var(--line);font-size:15px;font-family:inherit;background:var(--cream-50);color:var(--ink);outline:none;transition:border-color .15s;}
  .f-field input:focus{border-color:var(--green-600);background:white;}
  .f-field input.err{border-color:#e53e3e;}
  .f-err{font-size:12px;color:#e53e3e;}
  .f-row2{display:grid;grid-template-columns:140px 1fr;gap:12px;}
  .autofill-badge{padding:10px 14px;background:var(--green-100);border-radius:10px;font-size:13px;font-weight:600;color:var(--green-800);margin-bottom:16px;}
  .submit-btn{width:100%;padding:16px;border-radius:12px;background:var(--green-800);color:white;font-size:15px;font-weight:700;transition:background .15s;margin-top:4px;}
  .submit-btn:hover{background:var(--green-900);}
  .co-note{font-size:12px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.5;}
  .back-link{display:block;text-align:center;margin-top:14px;font-size:13px;color:var(--muted);}
  .back-link:hover{color:var(--ink);}

  .guarantee-row{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;padding-top:20px;font-size:12px;color:var(--muted);}

  /* Checkout upsell */
  .co-upsell{border:2px solid var(--green-200);border-radius:14px;overflow:hidden;margin-top:4px;}
  .co-upsell-head{background:var(--green-100);padding:10px 16px;font-size:13px;font-weight:700;color:var(--green-800);display:flex;align-items:center;gap:8px;}
  .co-upsell-body{padding:14px 16px;display:flex;align-items:center;gap:14px;background:white;}
  .co-upsell-img{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;flex-shrink:0;background:var(--cream-100);}
  .co-upsell-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.18);transform-origin:center;}
  .co-upsell-info{flex:1;min-width:0;}
  .co-upsell-name{font-size:13px;font-weight:700;color:var(--green-900);margin-bottom:3px;line-height:1.3;}
  .co-upsell-sub{font-size:12px;color:var(--green-700);font-weight:600;margin-bottom:4px;}
  .co-upsell-price{font-size:17px;font-weight:800;color:var(--green-900);}
  .co-upsell-parcela{font-size:11px;color:var(--muted);}
  .co-upsell-btns{display:flex;flex-direction:column;gap:6px;flex-shrink:0;}
  .co-upsell-add{padding:9px 14px;border-radius:8px;background:var(--green-800);color:white;font-size:12px;font-weight:700;cursor:pointer;border:none;white-space:nowrap;transition:background .15s;}
  .co-upsell-add:hover{background:var(--green-900);}
  .co-upsell-swap{padding:9px 14px;border-radius:8px;background:transparent;color:var(--green-800);font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid var(--green-400);white-space:nowrap;transition:background .15s;}
  .co-upsell-swap:hover{background:var(--green-100);}
  @media(max-width:480px){
    .co-upsell-body{flex-wrap:wrap;}
    .co-upsell-btns{flex-direction:row;width:100%;}
    .co-upsell-add,.co-upsell-swap{flex:1;text-align:center;}
  }

  @media(max-width:760px){
    .co-wrap{grid-template-columns:1fr;margin:16px auto;}
    .f-row2{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="checkout.jsx"></script>
</body>
</html>
