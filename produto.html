<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Produto — Amazon BSB</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%232a3618'/><polygon points='16,3 21,11 18,11 22,19 18.5,19 19.5,28 12.5,28 13.5,19 10,19 14,11 11,11' fill='%23a6b87a'/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --green-900:#2a3618;--green-800:#3d4a2a;--green-700:#4a5a30;--green-600:#5a6e3a;
    --green-500:#7a8f4a;--green-400:#a6b87a;--green-200:#d6dfb8;--green-100:#e8edd4;
    --cream-50:#faf7e8;--cream-100:#f5f0d8;--cream-200:#ebe4c2;
    --gold:#b89938;--gold-dark:#8d731f;--ink:#1d2110;--ink-soft:#3b4128;
    --muted:#6b6f56;--line:#e3decb;--paper:#fdfbf3;
    --shadow-md:0 4px 12px rgba(35,40,18,.08),0 2px 4px rgba(35,40,18,.04);
    --shadow-lg:0 16px 40px rgba(35,40,18,.12),0 4px 12px rgba(35,40,18,.06);
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;font-family:'Manrope',system-ui,sans-serif;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;} button{font-family:inherit;cursor:pointer;border:none;background:none;padding:0;color:inherit;} img{display:block;max-width:100%;}

  /* Header */
  .ph{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:1px solid var(--line);}
  .ph-inner{max-width:1200px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;}
  .ph-logo{font-weight:800;font-size:20px;letter-spacing:.04em;color:var(--green-800);display:flex;align-items:center;gap:6px;}
  .ph-logo-tag{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;border-left:1px solid var(--line);padding-left:12px;margin-left:4px;font-weight:400;}
  .ph-back{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;transition:background .15s;}
  .ph-back:hover{background:var(--cream-100);color:var(--green-800);}
  .ph-cart-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;background:var(--green-800);color:var(--cream-50);font-size:13px;font-weight:700;transition:background .15s;position:relative;}
  .ph-cart-btn:hover{background:var(--green-900);}
  .ph-cart-count{background:var(--gold);color:var(--ink);font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px;}

  /* Breadcrumb */
  .breadcrumb{max-width:1200px;margin:0 auto;padding:14px 24px;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .breadcrumb a{color:var(--muted);transition:color .15s;} .breadcrumb a:hover{color:var(--green-800);}

  /* Product hero */
  .pp-hero{max-width:1200px;margin:0 auto;padding:8px 24px 64px 24px;}
  .pp-hero-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:56px;align-items:flex-start;}
  .pp-img-wrap{position:sticky;top:80px;background:linear-gradient(180deg,var(--cream-50) 0%,var(--cream-100) 100%);border-radius:24px;padding:40px;display:flex;align-items:center;justify-content:center;min-height:380px;}
  .pp-img-wrap img{max-width:280px;object-fit:contain;}
  .pp-info{display:flex;flex-direction:column;gap:20px;padding-top:8px;}
  .pp-tags{display:flex;gap:6px;flex-wrap:wrap;}
  .tag{padding:5px 10px;border-radius:999px;font-size:11px;font-weight:700;}
  .tag-best{background:var(--green-800);color:var(--cream-50);}
  .tag-value{background:var(--gold);color:var(--ink);}
  .tag-frete{background:white;color:var(--green-800);border:1px solid var(--green-200);}
  .pp-rating{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);}
  .pp-stars{color:var(--gold);font-size:14px;}
  .pp-name{font-size:28px;font-weight:800;color:var(--green-900);margin:0;letter-spacing:-.02em;line-height:1.15;}
  .pp-price-block{display:flex;flex-direction:column;gap:3px;}
  .pp-was{font-size:14px;color:var(--muted);text-decoration:line-through;}
  .pp-price{font-size:38px;font-weight:800;color:var(--green-900);letter-spacing:-.03em;line-height:1;}
  .pp-installment{font-size:13px;color:var(--muted);} .pp-installment b{color:var(--green-700);}
  .pp-desc{font-size:15px;line-height:1.65;color:var(--muted);margin:0;}
  .pp-benefits{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;}
  .pp-benefits li{display:flex;align-items:flex-start;gap:10px;font-size:14px;color:var(--ink-soft);}
  .pp-benefits li::before{content:"✓";color:var(--green-700);font-weight:700;flex-shrink:0;}
  .pp-how-label{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--green-700);display:block;margin-bottom:4px;}
  .pp-how-text{font-size:14px;color:var(--muted);margin:0;line-height:1.55;}
  .pp-actions{display:flex;align-items:center;gap:12px;}
  .pp-qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;}
  .pp-qty button{width:40px;height:48px;display:inline-flex;align-items:center;justify-content:center;font-size:20px;color:var(--muted);transition:background .12s,color .12s;}
  .pp-qty button:hover{background:var(--cream-100);color:var(--green-800);}
  .pp-qty span{width:48px;text-align:center;font-size:18px;font-weight:700;}
  .pp-add-btn{flex:1;padding:14px 20px;border-radius:10px;background:var(--green-800);color:var(--cream-50);font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s;}
  .pp-add-btn:hover{background:var(--green-900);}
  .pp-add-btn.added{background:var(--gold-dark);}
  .pp-added-bar{padding:12px 16px;background:var(--green-100);border-radius:10px;font-size:13px;font-weight:600;color:var(--green-800);display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .pp-added-bar a{color:var(--green-800);text-decoration:underline;font-weight:700;}
  .pp-composition{font-size:12px;color:var(--muted);line-height:1.5;padding-top:12px;border-top:1px solid var(--line);margin:0;}

  /* Upsell */
  .pp-upsell{background:linear-gradient(135deg,var(--green-900) 0%,var(--green-700) 100%);padding:48px 0;}
  .pp-upsell-inner{max-width:1200px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:200px 1fr;gap:40px;align-items:center;}
  .pp-upsell-img{border-radius:16px;overflow:hidden;background:rgba(255,255,255,.1);}
  .pp-upsell-img img{width:100%;object-fit:cover;}
  .pp-upsell-content{color:var(--cream-50);display:flex;flex-direction:column;gap:14px;}
  .pp-upsell-badge{align-self:flex-start;background:var(--gold);color:var(--ink);font-size:11px;font-weight:700;padding:5px 12px;border-radius:999px;}
  .pp-upsell-content h3{font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em;line-height:1.15;}
  .pp-upsell-content p{font-size:15px;color:rgba(245,240,216,.8);margin:0;line-height:1.5;}
  .pp-upsell-row{display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
  .pp-upsell-price{font-size:36px;font-weight:800;letter-spacing:-.03em;}
  .pp-upsell-price small{display:block;font-size:13px;color:rgba(245,240,216,.65);font-weight:400;}
  .pp-upsell-btn{padding:14px 24px;border-radius:12px;background:var(--gold);color:var(--ink);font-size:15px;font-weight:700;transition:background .15s;display:inline-flex;align-items:center;gap:8px;}
  .pp-upsell-btn:hover{background:#c9a847;}

  /* Other products */
  .pp-others{padding:64px 0;background:var(--cream-50);}
  .pp-others-inner{max-width:1200px;margin:0 auto;padding:0 24px;}
  .pp-others h2{font-size:clamp(22px,2.4vw,32px);font-weight:700;color:var(--green-900);margin:0 0 32px 0;letter-spacing:-.02em;}
  .pp-others-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
  .pp-other-card{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:transform .2s,box-shadow .2s;}
  .pp-other-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);}
  .pp-other-img{aspect-ratio:1;background:linear-gradient(180deg,var(--cream-50) 0%,var(--cream-100) 100%);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .pp-other-img img{width:100%;height:100%;object-fit:cover;}
  .pp-other-info{padding:14px 16px;}
  .pp-other-name{font-size:13px;font-weight:700;color:var(--ink);line-height:1.25;margin-bottom:6px;}
  .pp-other-price{font-size:18px;font-weight:800;color:var(--green-900);letter-spacing:-.01em;}

  /* Footer */
  .pf{background:var(--green-900);color:rgba(245,240,216,.6);padding:28px 24px;}
  .pf-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:13px;}
  .pf-inner a{color:rgba(245,240,216,.8);transition:color .15s;} .pf-inner a:hover{color:var(--cream-50);}

  /* Mobile */
  @media(max-width:768px){
    .pp-hero-grid{grid-template-columns:1fr;gap:28px;}
    .pp-img-wrap{position:static;min-height:240px;padding:24px;}
    .pp-img-wrap img{max-width:180px;}
    .pp-name{font-size:22px;}
    .pp-price{font-size:30px;}
    .pp-hero{padding:8px 16px 48px 16px;}
    .pp-upsell-inner{grid-template-columns:1fr;gap:20px;}
    .pp-upsell-img{display:none;}
    .pp-upsell-content h3{font-size:20px;}
    .pp-upsell-price{font-size:28px;}
    .pp-others-grid{grid-template-columns:repeat(2,1fr);gap:12px;}
    .breadcrumb{padding:12px 16px;}
    .ph-logo-tag{display:none;}
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="produto.jsx"></script>
</body>
</html>
