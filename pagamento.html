<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pagamento — Amazon BSB</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{--green-900:#2a3618;--green-800:#3d4a2a;--green-700:#4a5a30;--green-100:#e8edd4;--cream-50:#faf7e8;--cream-100:#f5f0d8;--cream-200:#ebe4c2;--gold:#b89938;--ink:#1d2110;--ink-soft:#3b4128;--muted:#6b6f56;--line:#e3decb;--paper:#fdfbf3;}
  *{box-sizing:border-box;} html,body{margin:0;padding:0;font-family:'Manrope',system-ui,sans-serif;color:var(--ink);background:var(--cream-100);-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;} button{font-family:inherit;cursor:pointer;border:none;background:none;padding:0;}
  .fh{background:var(--green-900);padding:16px 24px;text-align:center;}
  .fh-logo{font-weight:800;font-size:18px;letter-spacing:.04em;color:#ebe4c2;}
  .fh-logo span{color:#a6b87a;}
  .progress{background:white;border-bottom:1px solid var(--line);padding:16px 24px;}
  .progress-inner{max-width:520px;margin:0 auto;display:flex;align-items:center;}
  .step{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;position:relative;}
  .step::after{content:'';position:absolute;top:14px;left:50%;width:100%;height:2px;background:var(--line);z-index:0;}
  .step:last-child::after{display:none;}
  .step-num{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;z-index:1;position:relative;}
  .step-num.done{background:var(--green-700);color:white;}
  .step-num.active{background:var(--green-900);color:white;}
  .step-num.pending{background:var(--cream-200);color:var(--muted);}
  .step-label{font-size:11px;color:var(--muted);font-weight:600;}
  .step.active .step-label{color:var(--green-900);}
  .pg-wrap{max-width:680px;margin:32px auto;padding:0 16px;display:flex;flex-direction:column;gap:20px;}
  .pg-card{background:white;border-radius:16px;border:1px solid var(--line);}
  .pg-card-head{padding:20px 24px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px;color:var(--green-900);}
  .pg-card-body{padding:24px;}
  .order-summary-line{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;padding:6px 0;color:var(--ink-soft);}
  .order-summary-line.total{border-top:1px solid var(--line);margin-top:8px;padding-top:14px;font-weight:800;font-size:20px;color:var(--green-900);}
  /* Payment methods */
  .pay-options{display:flex;flex-direction:column;gap:10px;}
  .pay-opt{padding:16px 18px;border:2px solid var(--line);border-radius:12px;display:flex;align-items:flex-start;gap:14px;cursor:pointer;transition:border-color .15s,background .15s;}
  .pay-opt:hover{border-color:var(--green-400);}
  .pay-opt.selected{border-color:var(--green-700);background:var(--cream-50);}
  .pay-opt-radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
  .pay-opt.selected .pay-opt-radio{border-color:var(--green-700);background:var(--green-700);}
  .pay-opt.selected .pay-opt-radio::after{content:'';width:8px;height:8px;border-radius:50%;background:white;}
  .pay-opt-label{font-size:15px;font-weight:700;color:var(--green-900);}
  .pay-opt-sub{font-size:13px;color:var(--muted);margin-top:2px;}
  /* Pix detail */
  .pix-box{margin-top:14px;padding:20px;background:var(--cream-50);border-radius:10px;border:1px solid var(--line);text-align:center;}
  .pix-key{font-family:'DM Mono',monospace;font-size:14px;color:var(--green-800);background:white;padding:10px 16px;border-radius:8px;display:inline-block;border:1px dashed var(--green-400);margin:10px 0;}
  .pix-note{font-size:12px;color:var(--muted);}
  /* Card form */
  .card-form{margin-top:14px;display:flex;flex-direction:column;gap:12px;}
  .f-field{display:flex;flex-direction:column;gap:5px;}
  .f-field label{font-size:12px;font-weight:700;color:var(--ink-soft);}
  .f-field input{padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);font-size:15px;font-family:inherit;background:var(--cream-50);outline:none;transition:border-color .15s;}
  .f-field input:focus{border-color:var(--green-600);background:white;}
  .f-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .confirm-btn{width:100%;padding:16px;border-radius:12px;background:var(--green-800);color:white;font-size:15px;font-weight:700;transition:background .15s;}
  .confirm-btn:hover{background:var(--green-900);}
  .guarantee-row{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;font-size:12px;color:var(--muted);}
  @media(max-width:540px){.f-row2{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="pagamento.jsx"></script>
</body>
</html>
